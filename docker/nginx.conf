worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Temp paths writable without root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    # Railway terminates TLS at its edge; keep the original scheme for Spring
    # (Secure cookies, OAuth redirect URI) instead of nginx's own plain-HTTP one
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen ${PORT} default_server;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA static files
        root /usr/share/nginx/html;
        index index.html;

        # Hashed assets — immutable, cache for 1 year
        location /assets/ {
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy API requests to Spring Boot
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # SPA fallback — any non-API, non-file request serves index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
