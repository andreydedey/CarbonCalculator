spring:
  datasource:
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.example.carboncalculator: INFO
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: carboncalculator
        version: ${app.version:0.0.1}
        environment: production
